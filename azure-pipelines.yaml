
stages:
- stage: Build
  displayName: Build image
  jobs:  
  - job: Build
    displayName: Build
    pool:
      vmImage: 'ubuntu-latest'
    steps:
        - script: |
            pip install build
            pip install twine
          displayName: 'Install build and twine'

        - script: |
            python -m build -w
          displayName: 'Python build'

        - task: TwineAuthenticate@1
          inputs:
            artifactFeed: 'integration-connectors'